name: Validate UPI Guard
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: guard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://guard:isolated-ci-only@localhost:5432/guard_test
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: python -m ruff check upi_guard research experiments tests scripts
      - run: python -m pytest -q --junitxml=reports/junit.xml
      - run: python -m unittest discover -s research/tests -v
      - run: python -m research.verify_results research/results
      - run: python -m experiments.poisoning --verify
      - run: python scripts/release_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: python scripts/ui_smoke.py
      - run: docker build -t upi-guard:test .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/junit.xml
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - run: bandit -r upi_guard -ll -f json -o bandit.json
      - run: pip-audit -r requirements.lock --no-deps --disable-pip -f json -o dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            bandit.json
            dependency-audit.json
